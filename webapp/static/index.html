<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLM-BSCVM</title>
  <link rel="stylesheet" href="/static/fonts/fonts.css">
  <link rel="stylesheet" href="/static/app.css?v=20261102">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand">LLM-BSCVM</div>

      <nav class="tabs" role="tablist">
        <button class="tab" role="tab" data-view="audit">Kiểm tra</button>
        <button class="tab" role="tab" data-view="history">Lịch sử</button>
      </nav>

      <div class="tools">
        <button class="btn sm" id="backendBtn" aria-expanded="false">
          <span class="dot" id="backendDot"></span>
          <span id="backendLabel">GPU</span>
        </button>
        <div class="pop" id="backendPop" hidden>
          <div class="pop-note" id="backendNote"></div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="view" id="audit">
      <div class="card editor" id="editorCard">
        <div class="editor-head">
          <input class="file-name" id="fileName" value="Contract.sol" spellcheck="false" autocomplete="off">
          <span class="muted" id="lineCount"></span>
          <div class="editor-tools">
            <button class="btn ghost sm" id="samplesBtn" aria-expanded="false">Mẫu</button>
            <div class="pop pop-list" id="samplesPop" hidden></div>
            <label class="btn ghost sm">
              Mở file
              <input type="file" id="fileInput" accept=".sol,.txt" hidden>
            </label>
            <button class="btn ghost sm" id="clearBtn">Xoá</button>
          </div>
        </div>
        <div class="code-area">
          <pre class="gutter" id="gutter">1</pre>
          <textarea id="code" spellcheck="false" placeholder="Dán mã Solidity vào đây"></textarea>
        </div>
      </div>

      <div class="actions">
        <button class="btn primary lg" id="runBtn">Kiểm tra</button>
        <button class="btn lg" id="stopBtn" hidden>Dừng</button>
      </div>

      <div class="card progress" id="progress" hidden>
        <div class="steps" id="steps"></div>
        <div class="progress-foot">
          <span id="progressText"></span>
          <span class="muted" id="progressTime"></span>
          <button class="btn ghost sm" data-act="log">Nhật ký</button>
        </div>
      </div>

      <div id="result"></div>

      <div class="card log" id="logCard" hidden>
        <pre id="logText"></pre>
      </div>
    </section>

    <section class="view" id="history">
      <div class="card list" id="runList"></div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/static/app.js?v=20261102"></script>
</body>
</html>
